<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/cadastroanimal.css">
  <title>Cadastro do Animal</title>
</head>

<body>
  <main>
    <h1>Cadastrar uma Patinha</h1>
    <h2>Fotos da Patinha</h2>
    <div class="grade-fotos">
      <div class="foto-um">
        <input type="file" id="foto1" accept="image/*" class="input-escondido">
        <label for="foto1" class="area-upload">Adionar foto</label>
      </div>
      <div class="foto-dois">
        <input type="file" id="foto2" accept="image/*" class="input-escondido">
        <label for="foto2" class="area-upload">Adionar foto</label>
      </div>
      <div class="foto-tres">
        <input type="file" id="foto3" accept="image/*" class="input-escondido">
        <label for="foto3" class="area-upload">Adionar foto</label>
      </div>
    </div>
    <form action="#" method="POST">
      <div class="infodopet">
        <div class="nome">
          <label for="nome">Nome:</label>
          <input type="text" id="nome">
        </div>
        <div class="cidade">
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade">
        </div>
        <div class="especie">
          <span>Especie:</span>
          <input type="radio" id="cachorro" name="especie" value="cachorro">
          <label for="cachorro" class="botaoespecie"><!--icone-->Cachorro</label>
          <input type="radio" id="gato" name="especie" value="gato">
          <label for="gato" class="botaoespecie">Gato<!--icone--></label>
        </div>
        <div class="sexo">
          <span>Sexo:</span>
          <input type="radio" id="femea" name="sexo" value="femea">
          <label for="femea" class="botaosexo"><!--icone-->Fêmea</label>
          <input type="radio" id="macho" name="sexo" value="macho">
          <label for="macho" class="botaosexo"><!--icone-->Macho</label>
        </div>
        <div class="idade">
          <label for="idade">Idade estipulada:</label>
          <input type="number" id="idade" min="0" max="25" placeholder="0"> <span>anos</span>
        </div>
        <div class="peso">
          <label for="peso">Peso:</label>
          <input type="number" id="peso" min="0" max="100" placeholder="0"> <span> kg</span>
        </div>
      </div>
      <div class="infoadicionais">
        <h2>Informações adicionais</h2>
        <div class="toggle-container">
          <label for="vacinado">Vacinado</label>
          <label class="switch">
            <input type="checkbox" id="vacinado">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="vermifugado">Vermifugado</label>
          <label class="switch">
            <input type="checkbox" id="vermifugado">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="castrado">Castrado</label>
          <label class="switch">
            <input type="checkbox" id="castrado">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="check-up">Check-up de saúde recente</label>
          <label class="switch">
            <input type="checkbox" id="check-up">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="cuidados">Cuidados especiais</label>
          <label class="switch">
            <input type="checkbox" id="cuidados">
            <span class="slider"></span>
          </label>
        </div>
        <div class="oqueleprecisa">
          <label for="precisa">O que ele precisa?</label>
          <input type="text" id="precisa">
        </div>
      </div>
      <div class="selecaoporte">
        <h2>Porte</h2>
        <input type="radio" id="portepequeno" name="porte" value="pequeno">
        <label for="portepequeno">Pequeno<!--icone--></label>
        <input type="radio" id="portemedio" name="porte" value="medio">
        <label for="portemedio">Médio<!--icone--></label>
        <input type="radio" id="portegrande" name="porte" value="grande">
        <label for="portegrande">Grande<!--icone--></label>
      </div>
      <div class="convivio-adaptacao">
        <h2>Convívio e Adaptação</h2>
        <div class="toggle-container">
          <label for="sociavel-caes">Sociável com cães</label>
          <label class="switch">
            <input type="checkbox" id="sociavel-caes">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="sociavel-gatos">Sociável com gatos</label>
          <label class="switch">
            <input type="checkbox" id="sociavel-gatos">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="docil-criancas">Dócil com crianças</label>
          <label class="switch">
            <input type="checkbox" id="docil-criancas">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="necessidades">Faz necessidades no tapete/rua</label>
          <label class="switch">
            <input type="checkbox" id="necessidades">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-container">
          <label for="apto-apartamento">Apto para apartamento</label>
          <label class="switch">
            <input type="checkbox" id="apto-apartamento">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <h2>Personalidade e Temperamento</h2>
      <div class="personalidade">
        <div class="opcao">
          <input type="checkbox" id="per-docil" value="docil">
          <label for="per-docil">Dócil</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-agressivo" value="agressivo">
          <label for="per-agressivo">Agressivo</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-alerta" value="alerta">
          <label for="per-alerta">Alerta</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-tranquilo" value="tranquilo">
          <label for="per-tranquilo">Tranquilo</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-afetuoso" value="afetuoso">
          <label for="per-afetuoso">Afetuoso</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-assustado" value="assustado">
          <label for="per-assustado">Assustado</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-preguicoso" value="preguicoso">
          <label for="per-preguicoso">Preguiçoso</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-ativo" value="ativo">
          <label for="per-ativo">Ativo</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-curioso" value="curioso">
          <label for="per-curioso">Curioso</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-independente" value="independente">
          <label for="per-independente">Independente</label>
        </div>
        <div class="opcao">
          <input type="checkbox" id="per-inteligente" value="inteligente">
          <label for="per-inteligente">Inteligente</label>
        </div>
      </div>
      <div class="pet-sobre">
        <h2>Sobre</h2>
        <label for="sobre">
          <p>Nos conte sobre onde você encontrou o animal, em que situação estava e como está sendo sua convivência com ele de forma mais detalha. Nos ajude a encontrar o melhor lar possível para o nosso amigo!</p>
        </label>
        <textarea id="sobre" rows="4" placeholder="Escreva aqui os detalhes..."></textarea>
      </div>
      <div class="pet-descrição">
        <h2>Descrição</h2>
        <label for="descricao">
          <p>Informe uma breve descrição sobre seu “patinha”, as pessoas ao navegar pelo site vão visualizar o que for descrito</p>
        </label>
        <textarea id="descricao" rows="4" placeholder="Escreva aqui como seu pet é..."></textarea>
      </div>
      <h2>Finalidade do Cadastro</h2>
      <div class="finalizarcadastro">
        <div class="selecaocadstro">
          <input type="radio" id="lartemporario" name="finalidade" value="lar-temporario">
          <label for="lartemporario">
            <strong>Lar temporário</strong>
            <span>(em busca de um lar temporário para tirar o animal da rua ou reduzir a superlotação de forma urgente)</span>
          </label>
        </div>
        <div class="selecaocadstro">
          <input type="radio" id="adocao" name="finalidade" value="adocao">
          <label for="adocao">
            <strong>Para Adoção</strong>
            <span>(o animal está recebendo os devidos cuidados e você tem as condições de ficar com ele até aparecer um interessado)</span>
          </label>
        </div>
        <div class="selecaocadstro">
          <input type="radio" id="apadrinhar" name="finalidade" value="apadrinhar">
          <label for="apadrinhar">
            <strong>Para Apadrinhar</strong>
            <span>(peça o suporte para ajudar um animal com deficiência)</span>
          </label>
        </div>
      </div>
      <div class="acaoformulario">
        <button type="submit" class="btn-enviar">Finalizar Cadastro</button>
      </div>
    </form>
  </main>
</body>

</html>
