<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do Animal</title>
</head>

<body>
  <main>
    <h1>Cadastrar uma Patinha</h1>
    <h2>Fotos da Patinha</h2>
    <div class="gradefotos">
      <div class="foto1"></div>
      <div class="foto2"></div>
      <div class="foto2"></div>
    </div>
    <form>
      <div class="nome">
        <label for="nome">Nome:</label>
        <input type="text" id="nome">
      </div>
      <div class="cidade">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade">
      </div>
      <div class="especie">
        <span>Especie:</span><!--não sei se o span fica adequado usar aqui-->
        <label for="cachorro" class="botaoespecie"> <!--icone do cachorro-->Cachorro</label>
        <input type="radio" id="cachorro" value="cachorro">
        <label for="gato" class="botaoespecie">Gato<!--icone do gato--></label>
        <input type="radio" id="gato" value="gato">
      </div>
      <div class="Sexo">
        <span>Sexo:</span>
        <label for="femea" class="botaosexo"> <!--simbolo fêmea-->Fêmea</label>
        <input type="radio" id="femea" value="Fêmea">
        <label for="macho" class="botaosexo"><!--simbolo macho-->Macho</label>
        <input type="radio" id="Macho" value="Macho">
      </div>
      <div class="idade">
        <label for="idade">Idade estipulada:</label>
        <input type="number" id="idade" min="0" max="25" placeholder="0"> <span>anos</span>
      </div>
      <div class="Peso">
        <label for="peso">Peso:</label>
        <input type="number" id="peso" min="0" max="25" placeholder="0"> <span>kg</span>
      </div>
      <h2>Informações adicionais</h2>
      <div class="toggle-container">
        <label for="vacinado">Vacinado</label>
        <label class="switch">
          <input type="checkbox" id="vacinado">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-container">
        <label for="vermifugado">Vermifugado</label>
        <label class="switch">
          <input type="checkbox" id="vermifugado">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-container">
        <label for="castrado">Castrado</label>
        <label class="switch">
          <input type="checkbox" id="castrado">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-container">
        <label for="check-up">Check-up de saúde recente</label>
        <label class="switch">
          <input type="checkbox" id="check-up">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-container">
        <label for="cuidados">Cuidados especiais</label>
        <label class="switch">
          <input type="checkbox" id="cuidados">
          <span class="slider"></span>
        </label>
      </div>
      <div class="oqueleprecisa">
        <label for="precisa">O uqe ele precisa?</label>
        <input type="text" id="precisa">
      </div>
    </form>
  </main>
</body>
</html>
