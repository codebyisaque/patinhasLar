<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/Login&RecuperarSenha.css" />
    <title>Recuperação de senha</title>
  </head>

  <body>
    <main class="container">
      <h1>Esqueceu sua senha?</h1>
      <p>Não se preocupe! Vamos ajudar você a recuperar o acesso à sua conta para continuar fazendo parte dessa corrente de carinho pelos animais..</p>
      <form>
        <div class="dado">
          <label for="email">E-mail cadastrado</label>
          <div class="input-icone">
          <i class="fa-regular fa-envelope"></i>
          <input placeholder="nome@exemplo.com" type="email" id="email"/>
          </div>
        </div>


        <div class="lembrar-senha">
           <p>Informe o e-mail utilizado no seu cadastro para receber as instruções de recuperação.</p>
        </div>

        <div class="botao">
          <button type="submit" class="btn-normal">Enviar instruções</button>
        </div>

        <div class="registro">
          <p>Lembrou sua senha? <a href="../pages/login.html">Voltar para login</a></p>
        </div>
      </form>
    </main>
  </body>
</html>
