<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/Login&RecuperarSenha.css" />
    <title>Login</title>
  </head>

  <body>
    <main class="container">
      <h1>Bem-vindo de volta</h1>
      <p>Acesse sua conta com segurança e continue de onde parou.</p>
      <form>
        <div class="dado">
          <label for="email">E-mail cadastrado</label>
          <input placeholder="nome@exemplo.com" type="email" id="email" />
        </div>

        <div class="dado">
          <label for="senha">Senha</label>
          <div class="input-iconeO">
            <input placeholder="••••••••••" type="password" id="senha" />
            <button
              type="button"
              id="OlhoSenha"
              class="btn-olhinho"
              aria-label="Mostrar ou ocultar senha"
            >
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="lembrar-senha">
          <label for="lembrar">
            <input type="checkbox" id="lembrar" /> Lembrar-me</label
          >
          <a href="./RecuperarSenha.html"> Esqueci minha senha</a>
        </div>

        <div class="botao">
          <a href="../index.html" type="submit" class="btn-normal">Entrar</a>

          <div class="divisao">
            <span>ou</span>
          </div>

          <button type="button" class="btn-google">
            <img
              src="../assets/img/icon_google.svg"
              alt="Google Logo"
              class="icon-google"
            />
            Entrar com Google
          </button>
        </div>

        <div class="registro">
          <p>
            Não tem conta?
            <a href="./cadastroDeUsuario.html">Cadastre-se agora</a>
          </p>
        </div>
      </form>
    </main>

    <script type="module" src="../js/script.js"></script>
  </body>
</html>
